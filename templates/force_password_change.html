<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ember &mdash; Set a New Password</title>
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/theme.css?v=3">
<script>(function(){var t=localStorage.getItem('ember-theme');document.documentElement.setAttribute('data-theme', t==='dark'?'dark':'light');})();</script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--eax-bg);
    color:var(--eax-ink);
    font-family:'DM Sans','Plus Jakarta Sans',system-ui,sans-serif;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    font-feature-settings:"ss01";
  }
  .card{
    width:100%;max-width:420px;
    background:var(--eax-surface);
    border:1px solid var(--eax-line);
    border-radius:14px;
    padding:36px;
    box-shadow:var(--eax-shadow-card);
  }
  .eyebrow{
    display:inline-flex;align-items:center;gap:10px;
    font-size:10px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;
    color:var(--eax-accent);margin-bottom:14px;
  }
  .eyebrow::before{content:"";display:inline-block;width:18px;height:1px;background:var(--eax-accent);}
  .card h2{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:22px;font-weight:700;color:var(--eax-ink-2);
    letter-spacing:-0.01em;margin-bottom:6px;
  }
  .card .sub{font-size:13.5px;color:var(--eax-muted);margin-bottom:28px;line-height:1.55;}
  .field{margin-bottom:18px;}
  label{
    display:block;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;
    color:var(--eax-muted);font-weight:700;margin-bottom:8px;
  }
  input[type=password]{
    width:100%;background:var(--eax-bg);border:1px solid var(--eax-line-2);
    border-radius:10px;color:var(--eax-ink);font-family:inherit;font-size:14px;
    padding:11px 14px;outline:none;transition:border-color .15s, box-shadow .15s;
  }
  input:focus{border-color:var(--eax-accent);box-shadow:0 0 0 3px var(--eax-accent-soft);}
  .error-msg{
    background:rgba(192,49,26,0.08);border:1px solid rgba(192,49,26,0.28);
    border-radius:10px;padding:10px 14px;font-size:13px;color:var(--eax-bad);margin-bottom:18px;
  }
  button[type=submit]{
    width:100%;background:var(--eax-accent);color:#FFF;border:none;border-radius:10px;
    padding:13px;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;
    letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;
    transition:transform .12s, box-shadow .15s, opacity .15s;
    box-shadow:0 6px 18px rgba(242,89,41,0.25);margin-top:4px;
  }
  button[type=submit]:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(242,89,41,0.32);}
  button[type=submit]:active{transform:translateY(0);}
  .footer-note{text-align:center;margin-top:18px;font-size:12px;color:var(--eax-subtle);}
  .footer-note a{color:var(--eax-accent);text-decoration:none;font-weight:600;}
</style>
</head>
<body>
  <div class="card">
    <span class="eyebrow">Security</span>
    <h2>Set a new password</h2>
    <div class="sub">
      Your password was reset by an administrator. Please choose a new password to continue.
    </div>
    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/force-password-change">
      <div class="field">
        <label>New password</label>
        <input type="password" name="new_password" autocomplete="new-password" autofocus required>
      </div>
      <div class="field">
        <label>Confirm new password</label>
        <input type="password" name="confirm_password" autocomplete="new-password" required>
      </div>
      <button type="submit">Set Password &amp; Continue</button>
    </form>
    <div class="footer-note"><a href="/logout">Sign out</a></div>
  </div>
</body>
</html>
